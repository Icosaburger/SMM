<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Relative Gantt Chart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.min.js"></script>
    <style>
        /* =========================================================================
           STRICT SCREENWIDTH & SCALING OVERRIDES
           ========================================================================= */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 10px;
            background-color: #fff;
            overflow-x: hidden; /* Prevent body-level scrolling */
        }

        .gantt-wrapper {
            width: 100% !important;
            max-width: 100% !important;
            overflow-x: hidden;
            border: 1px solid #eaeaea;
            border-radius: 5px;
            background: #fafafa;
            box-sizing: border-box;
        }

        /* Force the library's SVG wrapper to scale down to the screen width */
        .gantt-container {
            width: 100% !important;
            max-width: 100% !important;
            overflow: hidden !important;
        }

        svg#gantt {
            width: 100% !important;
            max-width: 100% !important;
            height: auto !important;
        }

        /* =========================================================================
           COMPLETE CALENDAR DATE REMOVAL & WEEK NUMBER GENERATOR
           ========================================================================= */
        
        /* 1. Hide both standard text rows (removes all dates and months completely) */
        .gantt .grid-header .upper-text,
        .gantt .grid-header .lower-text {
            display: none !important;
        }

        /* 2. Set up a CSS counter on the header row container */
        .gantt .grid-header {
            counter-reset: week-counter -1; /* Starts counting from Week 0 */
        }

        /* 3. Target the underlying column grid lines to inject sequential week text */
        .gantt .grid .tick {
            counter-increment: week-counter;
        }

        .gantt .grid .tick::after {
            content: "Wk " counter(week-counter);
            font-size: 11px;
            font-weight: 600;
            fill: #42526e;
            position: absolute;
            transform: translate(12px, -25px); /* Positions text perfectly inside header bar */
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div class="gantt-wrapper">
        <div class="gantt-container">
            <svg id="gantt"></svg>
        </div>
    </div>

    <script>
        // =========================================================================
        // HUMAN READABLE DATA TABLE
        // =========================================================================
        const projectData = [
            { id: 'task-1', name: 'Task 1: Core Setup', durationWeeks: 4, startWeek: 0, dependsOn: '', relativeTo: '', offsetWeeks: 0, progress: 60 },
            { id: 'task-2', name: 'Task 2: Sub-System', durationWeeks: 3, startWeek: 0, dependsOn: 'task-1', relativeTo: 'start', offsetWeeks: 2, progress: 20 },
            { id: 'task-3', name: 'Task 3: Integration', durationWeeks: 5, startWeek: 0, dependsOn: 'task-2', relativeTo: 'finish', offsetWeeks: 1, progress: 0 }
        ];
        // =========================================================================

        const BASE_DATE = new Date(); 

        function addDays(date, days) {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        }

        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        const processedTasks = [];
        const taskMap = {};
        let totalProjectWeeks = 0;

        projectData.forEach(task => {
            let startCalculatedDate;

            if (task.dependsOn && taskMap[task.dependsOn]) {
                const parent = taskMap[task.dependsOn];
                if (task.relativeTo === 'start') {
                    startCalculatedDate = addDays(parent._rawStart, task.offsetWeeks * 7);
                } else if (task.relativeTo === 'finish') {
                    startCalculatedDate = addDays(parent._rawEnd, task.offsetWeeks * 7);
                } else {
                    startCalculatedDate = addDays(BASE_DATE, task.startWeek * 7);
                }
            } else {
                startCalculatedDate = addDays(BASE_DATE, task.startWeek * 7);
            }

            const endCalculatedDate = addDays(startCalculatedDate, task.durationWeeks * 7);

            task._rawStart = startCalculatedDate;
            task._rawEnd = endCalculatedDate;
            taskMap[task.id] = task;

            const weeksFromStart = Math.ceil((endCalculatedDate - BASE_DATE) / (1000 * 60 * 60 * 24 * 7));
            if (weeksFromStart > totalProjectWeeks) {
                totalProjectWeeks = weeksFromStart;
            }

            processedTasks.push({
                id: task.id,
                name: task.name,
                start: formatDate(startCalculatedDate),
                end: formatDate(endCalculatedDate),
                progress: task.progress,
                dependencies: task.dependsOn
            });
        });

        // Calculate maximum layout constraints to guarantee it squeezes into view
        const screenPadding = 30;
        const leftLabelSpacers = 140;
        const netChartTimelineWidth = window.innerWidth - screenPadding - leftLabelSpacers;
        const fitColumnWidth = Math.floor(netChartTimelineWidth / (totalProjectWeeks + 1));

        // Initialize the layout
        const gantt = new Gantt("#gantt", processedTasks, {
