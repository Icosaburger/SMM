<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Relative Gantt Chart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 10px;
            background-color: #fff;
            color: #333;
        }
        h2 {
            font-size: 1.4rem;
            margin-bottom: 4px;
            color: #172b4d;
        }
        p.subtitle {
            font-size: 0.85rem;
            color: #6b778c;
            margin-bottom: 15px;
        }
        
        /* Force the chart container to fit the exact screen width without forcing a scrollbar */
        .gantt-wrapper {
            width: 100%;
            max-width: 100vw;
            box-sizing: border-box;
            border: 1px solid #eaeaea;
            border-radius: 5px;
            background: #fafafa;
        }
        
        .gantt-container {
            width: 100%;
            overflow: hidden; /* Removes local scrollbars */
        }
        
        svg#gantt {
            width: 100%; /* Forces the SVG element to stay within bounds */
        }

        /* HIDE DATES FROM HEADER: Targets lower row calendar text strings */
        .gantt .grid-header .lower-text {
            display: none !important;
        }

        /* ADJUST UPPER TEXT STYLE: Centers week markers nicely */
        .gantt .grid-header .upper-text {
            transform: translateY(12px);
            font-weight: 600;
            fill: #42526e;
        }
    </style>
</head>
<body>

    <h2>Project Roadmap</h2>
    <p class="subtitle">Relative project timeline structured by week numbers.</p>

    <div class="gantt-wrapper">
        <div class="gantt-container">
            <svg id="gantt"></svg>
        </div>
    </div>

    <script>
        // =========================================================================
        // HUMAN READABLE DATA TABLE
        // =========================================================================
        const projectData = [
            { id: 'task-1', name: 'Task 1: Core Setup', durationWeeks: 4, startWeek: 0, dependsOn: '', relativeTo: '', offsetWeeks: 0, progress: 60 },
            { id: 'task-2', name: 'Task 2: Sub-System', durationWeeks: 3, startWeek: 0, dependsOn: 'task-1', relativeTo: 'start', offsetWeeks: 2, progress: 20 },
            { id: 'task-3', name: 'Task 3: Integration', durationWeeks: 5, startWeek: 0, dependsOn: 'task-2', relativeTo: 'finish', offsetWeeks: 1, progress: 0 }
        ];
        // =========================================================================

        const BASE_DATE = new Date(); 

        function addDays(date, days) {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        }

        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        const processedTasks = [];
        const taskMap = {};
        let totalProjectWeeks = 0;

        projectData.forEach(task => {
            let startCalculatedDate;

            if (task.dependsOn && taskMap[task.dependsOn]) {
                const parent = taskMap[task.dependsOn];
                if (task.relativeTo === 'start') {
                    startCalculatedDate = addDays(parent._rawStart, task.offsetWeeks * 7);
                } else if (task.relativeTo === 'finish') {
                    startCalculatedDate = addDays(parent._rawEnd, task.offsetWeeks * 7);
                } else {
                    startCalculatedDate = addDays(BASE_DATE, task.startWeek * 7);
                }
            } else {
                startCalculatedDate = addDays(BASE_DATE, task.startWeek * 7);
            }

            const endCalculatedDate = addDays(startCalculatedDate, task.durationWeeks * 7);

            task._rawStart = startCalculatedDate;
            task._rawEnd = endCalculatedDate;
            taskMap[task.id] = task;

            // Track absolute duration span from base start to calculate required scale sizing
            const weeksFromStart = Math.ceil((endCalculatedDate - BASE_DATE) / (1000 * 60 * 60 * 24 * 7));
            if (weeksFromStart > totalProjectWeeks) {
                totalProjectWeeks = weeksFromStart;
            }

            processedTasks.push({
                id: task.id,
                name: task.name,
                start: formatDate(startCalculatedDate),
                end: formatDate(endCalculatedDate),
                progress: task.progress,
                dependencies: task.dependsOn
            });
        });

        // DYNAMIC SCREENWIDTH CALCULATION:
        // Allocates 160px baseline space for task labels on the left side, 
        // then divides remaining real estate evenly among total project weeks.
        const availableWidth = window.innerWidth - 40; 
        const chartTimelineWidth = availableWidth - 160;
        const calculatedColumnWidth = Math.max(35, Math.floor(chartTimelineWidth / (totalProjectWeeks + 2)));

        // Initialize and render the Gantt chart
        const gantt = new Gantt("#gantt", processedTasks, {
            header_height: 45,
            column_width: calculatedColumnWidth,
            step: 24,
            view_mode: 'Week', 
            bar_height: 25,
            bar_corner_radius: 3,
            arrow_curve: 5,
            padding: 18,
            date_format: 'YYYY-MM-DD',
            // Custom label text completely free of dates
            custom_popup_html: function(task) {
                const original = taskMap[task.id];
                return `
                    <div class="details-container" style="padding: 10px; font-size: 13px; font-family: sans-serif;">
                        <h5 style="margin:0 0 5px 0;">${task.name}</h5>
                        <p style="margin:3px 0;"><strong>Duration:</strong> ${original.durationWeeks} weeks</p>
                        <p style="margin:3px 0;"><strong>Progress:</strong> ${task.progress}%</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
