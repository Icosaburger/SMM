<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Operational Timeline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 10px;
            background-color: #fff;
            color: #333;
            user-select: none; /* Disables dragging and text highlighting */
        }

        .gantt-wrapper {
            width: 100%;
            max-width: 100%;
            border: 1px solid #eaeaea;
            border-radius: 6px;
            background: #fafafa;
            box-sizing: border-box;
            padding: 15px;
            overflow: hidden;
        }

        /* Group Header Section */
        .group-header {
            background-color: #ebecf0;
            color: #172b4d;
            font-weight: 700;
            font-size: 12px;
            padding: 6px 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 15px;
            border-radius: 4px;
        }

        /* Legend Component Styling */
        .legend-container {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            padding: 10px;
            background: #fff;
            border: 1px solid #edf2f7;
            border-radius: 4px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 12px;
            font-weight: 500;
            color: #4a5568;
        }

        .legend-color {
            width: 24px;
            height: 14px;
            border-radius: 3px;
            margin-right: 8px;
        }

        /* Chart Layout Grid */
        .gantt-grid {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* Row Layouts */
        .gantt-row {
            display: flex;
            align-items: center;
            height: 38px;
            border-bottom: 1px solid #f0f0f0;
        }

        .gantt-row.header {
            height: 30px;
            border-bottom: 2px solid #e2e8f0;
            font-weight: 600;
            font-size: 11px;
            color: #4a5568;
        }

        .gantt-row:last-child {
            border-bottom: none;
        }

        /* Column Settings */
        .label-column {
            width: 150px;
            min-width: 150px;
            font-size: 13px;
            font-weight: 500;
            color: #1a202c;
            padding-right: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timeline-column {
            flex-grow: 1;
            display: flex;
            position: relative;
            height: 100%;
            align-items: center;
        }

        /* Week Header Blocks */
        .week-cell {
            flex: 1;
            text-align: center;
            border-left: 1px solid #edf2f7;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .week-cell:first-child {
            border-left: none;
        }

        /* Grid Background Guides */
        .row-guides {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            pointer-events: none;
        }

        .guide-cell {
            flex: 1;
            height: 100%;
            border-left: 1px solid #edf2f7;
        }

        .guide-cell:first-child {
            border-left: none;
        }

        /* Phased Progress Bars */
        .phase-bar {
            position: absolute;
            height: 22px;
            border-radius: 4px;
            pointer-events: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="legend-container">
        <div class="legend-item">
            <div class="legend-color" style="background-color: #ffccd5;"></div>
            <span>Queue / Waiting</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #3b82f6;"></div>
            <span>Category 2 Training</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #10b981;"></div>
            <span>Advanced/Category 3 Training</span>
        </div>
    </div>

    <div class="gantt-wrapper">
        <div class="gantt-grid" id="ganttGrid">
            </div>
    </div>

    <script>
        // =========================================================================
        // DYNAMIC TRACK DATA AND STRUCTURAL CONFIGURATION
        //
        // startWeek:        Used if the track is independent (dependsOn is blank).
        // dependsOn:        The ID string of the parent track you want to follow.
        // relativeTo:       'start' (parent start), 'finish' (parent total end),
        //                   or 'phase-finish' (specific phase finish marker).
        // relativeToPhase:  Name of the parent phase to check if using 'phase-finish'.
        // offsetWeeks:      Number of weeks to delay/offset from your milestone choice.
        // =========================================================================
        const HEX_WAIT = '#ffccd5';
        const HEX_CORE = '#3b82f6';
        const HEX_ADVD = '#10b981';

        const trainingGroups = [
            {
                groupName: "Scanning Electron Microscopy (SEM)",
                tracks: [
                    {
                        id: 'sem-basic',
                        name: 'SEM Basic',
                        startWeek: 0,
                        dependsOn: '',
                        relativeTo: '',
                        relativeToPhase: '',
                        offsetWeeks: 0,
                        phases: [
                            { name: 'Waiting', duration: 2, color: HEX_WAIT },
                            { name: 'Training', duration: 2, color: HEX_CORE },
                            { name: 'Advanced', duration: 2, color: HEX_ADVD }
                        ]
                    },
                    {
                        id: 'sem-fib',
                        name: 'SEM FIB',
                        startWeek: 0, 
                        dependsOn: 'sem-basic', 
                        relativeTo: 'phase-finish', // Hooks directly into a single phase milestone
                        relativeToPhase: 'Training', // Targets completion of Core Training (Wk 4)
                        offsetWeeks: 1,              // Delays it to start 1 week later (Wk 5)
                        phases: [
                            { name: 'Training', duration: 4, color: HEX_CORE },
                            { name: 'Advanced', duration: 8, color: HEX_ADVD }
                        ]
                    }
                ]
            },
            {
                groupName: "Laser Optics (LO)",
                tracks: [
                    {
                        id: 'lo-basic',
                        name: 'LO Basic',
                        startWeek: 0,
                        dependsOn: '',
                        relativeTo: '',
                        relativeToPhase: '',
                        offsetWeeks: 0,
                        phases: [
                            { name: 'Waiting', duration: 2, color: HEX_WAIT },
                            { name: 'Training', duration: 2, color: HEX_CORE },
                            { name: 'Advanced', duration: 2, color: HEX_ADVD }
                        ]
                    },
                    {
                        id: 'lo-tirf',
                        name: 'LO TIRF',
                        startWeek: 0,
                        dependsOn: 'lo-basic',
                        relativeTo: 'phase-finish', // Hooks directly into a single phase milestone
                        relativeToPhase: 'Training', // Targets completion of Core Training (Wk 4)
                        offsetWeeks: 1,              // Delays it to start 1 week later (Wk 5)
                        phases: [
                            { name: 'Training', duration: 4, color: HEX_CORE },
                            { name: 'Advanced', duration: 8, color: HEX_ADVD }
                        ]
                    }
                ]
            }
        ];
        // =========================================================================

        const trackMap = {};
        let maxWeekReached = 0;

        // Step 1: Process dependency tree paths sequentially
        trainingGroups.forEach(group => {
            group.tracks.forEach(track => {
                let currentStart = track.startWeek;

                if (track.dependsOn && trackMap[track.dependsOn]) {
                    const parent = trackMap[track.dependsOn];
                    
                    if (track.relativeTo === 'start') {
                        currentStart = parent._totalStart + track.offsetWeeks;
                    } else if (track.relativeTo === 'finish') {
                        currentStart = parent._totalEnd + track.offsetWeeks;
                    } else if (track.relativeTo === 'phase-finish' && parent._phaseEndMarkers[track.relativeToPhase] !== undefined) {
                        // Dynamically sets baseline to the exact week the specified parent phase wrapped up
                        currentStart = parent._phaseEndMarkers[track.relativeToPhase] + track.offsetWeeks;
                    }
                }

                if (currentStart < 0) currentStart = 0;

                track._totalStart = currentStart;
                track._calculatedPhases = [];
                track._phaseEndMarkers = {}; // Stores end week markers for child reference maps

                // Loop sequentially across each training block segment to stack durations
                track.phases.forEach(phase => {
                    const phaseStart = currentStart;
                    const phaseEnd = currentStart + phase.duration;
                    
                    track._calculatedPhases.push({
                        start: phaseStart,
                        end: phaseEnd,
                        duration: phase.duration,
                        color: phase.color
                    });

                    currentStart = phaseEnd; 
                    track._phaseEndMarkers[phase.name] = phaseEnd; // Log when this specific phase block stops
                });

                track._totalEnd = currentStart;
                trackMap[track.id] = track; 

                if (track._totalEnd > maxWeekReached) {
                    maxWeekReached = track._totalEnd;
                }
            });
        });

        const totalColumnsCount = maxWeekReached;
        const gridContainer = document.getElementById('ganttGrid');

        // Step 2: Render Header Elements
        let headerHtml = `<div class="gantt-row header"><div class="label-column">Training Track</div><div class="timeline-column">`;
        for (let i = 0; i <= totalColumnsCount; i++) {
            headerHtml += `<div class="week-cell">Wk ${i}</div>`;
        }
        headerHtml += `</div></div>`;
        gridContainer.innerHTML += headerHtml;

        // Step 3: Render Structural Rows grouped by operational modules
        trainingGroups.forEach(group => {
            let groupRowHtml = `<div class="group-header">${group.groupName}</div>`;
            gridContainer.innerHTML += groupRowHtml;

            group.tracks.forEach(track => {
                let rowHtml = `
                    <div class="gantt-row">
                        <div class="label-column" title="${track.name}">${track.name}</div>
                        <div class="timeline-column">
                            <div class="row-guides">`;
                
                for (let i = 0; i <= totalColumnsCount; i++) {
                    rowHtml += `<div class="guide-cell"></div>`;
                }
                
                rowHtml += `</div>`;

                // Draw independent custom blocks for each distinct training segment
                track._calculatedPhases.forEach(p => {
                    const leftPercent = (p.start / (totalColumnsCount + 1)) * 100;
                    const widthPercent = (p.duration / (totalColumnsCount + 1)) * 100;

                    rowHtml += `
                        <div class="phase-bar" style="left: ${leftPercent}%; width: ${widthPercent}%; background-color: ${p.color};">
                        </div>
                    `;
                });

                rowHtml += `
                        </div>
                    </div>
                `;
                gridContainer.innerHTML += rowHtml;
            });
        });
    </script>
</body>
</html>
