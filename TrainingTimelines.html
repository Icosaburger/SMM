<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative CSS Gantt Chart</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 10px;
            background-color: #fff;
            color: #333;
            user-select: none; /* Disables text highlighting/interactivity */
        }

        .gantt-wrapper {
            width: 100%;
            max-width: 100%;
            border: 1px solid #eaeaea;
            border-radius: 6px;
            background: #fafafa;
            box-sizing: border-box;
            padding: 10px;
            overflow: hidden;
        }

        /* Chart Layout Grid */
        .gantt-grid {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* Header & Row Setup */
        .gantt-row {
            display: flex;
            align-items: center;
            height: 35px;
            border-bottom: 1px solid #f0f0f0;
        }

        .gantt-row.header {
            height: 30px;
            border-bottom: 2px solid #e2e8f0;
            font-weight: 600;
            font-size: 11px;
            color: #4a5568;
        }

        .gantt-row:last-child {
            border-bottom: none;
        }

        /* Column Allocations */
        .label-column {
            width: 150px;
            min-width: 150px;
            font-size: 13px;
            color: #1a202c;
            padding-right: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timeline-column {
            flex-grow: 1;
            display: flex;
            position: relative;
            height: 100%;
            align-items: center;
        }

        /* Header Week Cells */
        .week-cell {
            flex: 1;
            text-align: center;
            border-left: 1px solid #edf2f7;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .week-cell:first-child {
            border-left: none;
        }

        /* Background Grid Guides for Rows */
        .row-guides {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            pointer-events: none;
        }

        .guide-cell {
            flex: 1;
            height: 100%;
            border-left: 1px solid #edf2f7;
        }

        .guide-cell:first-child {
            border-left: none;
        }

        /* Gantt Bar Styling (Completely Static) */
        .gantt-bar-container {
            position: absolute;
            height: 20px;
            display: flex;
            align-items: center;
            pointer-events: none; /* Disables all mouse clicks, drags, and hovers */
        }

        .gantt-bar {
            height: 100%;
            background-color: #a3b8cc; /* Solid timeline fill background */
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .gantt-bar-progress {
            height: 100%;
            background-color: #3b82f6; /* Blue progress color indication */
            width: 0%;
        }
    </style>
</head>
<body>

    <div class="gantt-wrapper">
        <div class="gantt-grid" id="ganttGrid">
            </div>
    </div>

    <script>
        // =========================================================================
        // HUMAN READABLE DATA TABLE
        // =========================================================================
        const projectData = [
            { id: 'task-1', name: 'Task 1: Core Setup', durationWeeks: 4, startWeek: 0, dependsOn: '', relativeTo: '', offsetWeeks: 0, progress: 60 },
            { id: 'task-2', name: 'Task 2: Sub-System', durationWeeks: 3, startWeek: 0, dependsOn: 'task-1', relativeTo: 'start', offsetWeeks: 2, progress: 20 },
            { id: 'task-3', name: 'Task 3: Integration', durationWeeks: 5, startWeek: 0, dependsOn: 'task-2', relativeTo: 'finish', offsetWeeks: 1, progress: 0 }
        ];
        // =========================================================================

        const taskMap = {};
        let maxWeekReached = 0;

        // Process dependencies and calculate relative positions based entirely on numbers
        projectData.forEach(task => {
            let calculatedStart = 0;

            if (task.dependsOn && taskMap[task.dependsOn]) {
                const parent = taskMap[task.dependsOn];
                if (task.relativeTo === 'start') {
                    calculatedStart = parent._start + task.offsetWeeks;
                } else if (task.relativeTo === 'finish') {
                    calculatedStart = parent._end + task.offsetWeeks;
                } else {
                    calculatedStart = task.startWeek;
                }
            } else {
                calculatedStart = task.startWeek;
            }

            // Lock values so tasks can never scale backwards into negative scopes
            if (calculatedStart < 0) calculatedStart = 0;

            task._start = calculatedStart;
            task._end = calculatedStart + task.durationWeeks;
            taskMap[task.id] = task;

            if (task._end > maxWeekReached) {
                maxWeekReached = task._end;
            }
        });

        const totalColumnsCount = maxWeekReached;
        const gridContainer = document.getElementById('ganttGrid');

        // 1. Generate Header Row (Clean, simple sequential Week numbering)
        let headerHtml = `<div class="gantt-row header"><div class="label-column">Tasks</div><div class="timeline-column">`;
        for (let i = 0; i < totalColumnsCount; i++) {
            headerHtml += `<div class="week-cell">Wk ${i}</div>`;
        }
        headerHtml += `</div></div>`;
        gridContainer.innerHTML += headerHtml;

        // 2. Generate Content Rows
        projectData.forEach(task => {
            // Calculate percentage metrics to map styles straight into flexbox blocks
            const startPercent = (task._start / totalColumnsCount) * 100;
            const widthPercent = (task.durationWeeks / totalColumnsCount) * 100;

            let rowHtml = `
                <div class="gantt-row">
                    <div class="label-column" title="${task.name}">${task.name}</div>
                    <div class="timeline-column">
                        <div class="row-guides">`;
            
            for (let i = 0; i < totalColumnsCount; i++) {
                rowHtml += `<div class="guide-cell"></div>`;
            }
            
            rowHtml += `
                        </div>
                        <div class="gantt-bar-container" style="left: ${startPercent}%; width: ${widthPercent}%;">
                            <div class="gantt-bar">
                                <div class="gantt-bar-progress" style="width: ${task.progress}%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            gridContainer.innerHTML += rowHtml;
        });
    </script>
</body>
</html>
