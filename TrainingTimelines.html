<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEM Training Timeline Matrix</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 10px;
            background-color: #fff;
            color: #333;
            user-select: none; /* Disables dragging and text highlighting */
        }

        .gantt-wrapper {
            width: 100%;
            max-width: 100%;
            border: 1px solid #eaeaea;
            border-radius: 6px;
            background: #fafafa;
            box-sizing: border-box;
            padding: 15px;
            overflow: hidden;
        }

        /* Group Header Section */
        .group-header {
            background-color: #ebecf0;
            color: #172b4d;
            font-weight: 700;
            font-size: 12px;
            padding: 6px 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 15px;
            border-radius: 4px;
        }

        /* Legend Component Styling */
        .legend-container {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            padding: 10px;
            background: #fff;
            border: 1px solid #edf2f7;
            border-radius: 4px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 12px;
            font-weight: 500;
            color: #4a5568;
        }

        .legend-color {
            width: 24px;
            height: 14px;
            border-radius: 3px;
            margin-right: 8px;
        }

        /* Chart Layout Grid */
        .gantt-grid {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* Row Layouts */
        .gantt-row {
            display: flex;
            align-items: center;
            height: 38px;
            border-bottom: 1px solid #f0f0f0;
        }

        .gantt-row.header {
            height: 30px;
            border-bottom: 2px solid #e2e8f0;
            font-weight: 600;
            font-size: 11px;
            color: #4a5568;
        }

        .gantt-row:last-child {
            border-bottom: none;
        }

        /* Column Settings */
        .label-column {
            width: 260px;
            min-width: 260px;
            font-size: 13px;
            font-weight: 500;
            color: #1a202c;
            padding-right: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timeline-column {
            flex-grow: 1;
            display: flex;
            position: relative;
            height: 100%;
            align-items: center;
        }

        /* Week Header Blocks */
        .week-cell {
            flex: 1;
            text-align: center;
            border-left: 1px solid #edf2f7;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .week-cell:first-child {
            border-left: none;
        }

        /* Grid Background Guides */
        .row-guides {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            pointer-events: none;
        }

        .guide-cell {
            flex: 1;
            height: 100%;
            border-left: 1px solid #edf2f7;
        }

        .guide-cell:first-child {
            border-left: none;
        }

        /* Phased Progress Bars */
        .phase-bar {
            position: absolute;
            height: 22px;
            border-radius: 4px;
            pointer-events: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="legend-container">
        <div class="legend-item">
            <div class="legend-color" style="background-color: #ffccd5;"></div>
            <span>Wait Time</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #3b82f6;"></div>
            <span>Category 2 Training</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #10b981;"></div>
            <span>Meaningful Results</span>
        </div>
    </div>

    <div class="gantt-wrapper">
        <div class="gantt-grid" id="ganttGrid">
            </div>
    </div>

    <script>
        // =========================================================================
        // RAW IMPORT DATA MATRIX (EASY TO COPY/PASTE OR AMEND)
        // =========================================================================
        const HEX_WAIT = '#ffccd5';
        const HEX_CAT2 = '#3b82f6';
        const HEX_RSLT = '#10b981';

        const rawImportData = [
            { technique: "SEM Imaging", prereq: "None", wait: 2, cat2: 1, results: 4 },
            { technique: "FIB-SEM Basic", prereq: "Meaningful Results in SEM Imaging", wait: 3, cat2: 3, results: 8 },
            { technique: "EDS - Qualitative", prereq: "Meaningful Results in SEM Imaging", wait: 0, cat2: 1, results: 4 },
            { technique: "STEM/Low kV backscatter", prereq: "Meaningful Results in SEM Imaging", wait: 0, cat2: 1, results: 4 },
            { technique: "Standard EBSD", prereq: "Category 2 in SEM Imaging", wait: 2, cat2: 2, results: 8 },
            { technique: "Transmission EBSD (TKD)", prereq: "Category 2 in SEM Imaging", wait: 2, cat2: 3, results: 12 },
            { technique: "In-situ techniques - SEM", prereq: "Meaningful Results in SEM Imaging", wait: 2, cat2: 2, results: 10 },
            { technique: "In-situ techniques - EBSD", prereq: "Meaningful Results in Standard EBSD", wait: 2, cat2: 2, results: 10 },
            { technique: "In-situ techniques - TKD", prereq: "Meaningful Results in Transmission EBSD (TKD)", wait: 2, cat2: 2, results: 10 },
            { technique: "FIB-SEM Basics", prereq: "Meaningful Results in SEM Imaging", wait: 0, cat2: 0, results: 0 },
            { technique: "FIB-SEM TEM Sample Prep", prereq: "Category 2 in FIB-SEM Basics", wait: 0, cat2: 2, results: 6 },
            { technique: "FIB-SEM Nanopillar Prep", prereq: "Category 2 in FIB-SEM Basics", wait: 0, cat2: 3, results: 8 },
            { technique: "FIB-SEM APT Prep - shaping", prereq: "Category 2 in FIB-SEM Basics", wait: 0, cat2: 2, results: 6 },
            { technique: "FIB-SEM APT Prep - site specific with lift out", prereq: "Meaningful Results in FIB-SEM Basics", wait: 3, cat2: 4, results: 12 },
            { technique: "FIB-SEM 3D EDS", prereq: "Meaningful Results in FIB-SEM Basics", wait: 3, cat2: 2, results: 8 },
            { technique: "FIB-SEM 3D EBSD", prereq: "Meaningful Results in FIB-SEM Basics", wait: 3, cat2: 3, results: 10 },
            { technique: "FIB-SEM Slice & View", prereq: "Meaningful Results in FIB-SEM Basics", wait: 3, cat2: 1, results: 6 }
        ];
        // =========================================================================

        const processedTracks = [];
        const trackMap = {};
        let maxWeekReached = 0;

        // Step 1: Parse table rules & calculate relative anchors dynamically
        rawImportData.forEach(item => {
            let currentStart = 0;

            // Handle relational parsing strings safely
            if (item.prereq && item.prereq !== "None") {
                let targetTechnique = "";
                let targetMilestone = "";

                if (item.prereq.startsWith("Meaningful Results in ")) {
                    targetTechnique = item.prereq.replace("Meaningful Results in ", "").trim();
                    targetMilestone = "results";
                } else if (item.prereq.startsWith("Category 2 in ")) {
                    targetTechnique = item.prereq.replace("Category 2 in ", "").trim();
                    targetMilestone = "cat2";
                }

                const parent = trackMap[targetTechnique];
                if (parent) {
                    currentStart = parent._milestones[targetMilestone] || 0;
                }
            }

            const w = item.wait || 0;
            const c = item.cat2 || 0;
            const r = item.results || 0;

            const calculatedPhases = [];
            let cursor = currentStart;

            if (w > 0) {
                calculatedPhases.push({ start: cursor, end: cursor + w, duration: w, color: HEX_WAIT });
                cursor += w;
            }
            
            const cat2Start = cursor;
            if (c > 0) {
                calculatedPhases.push({ start: cursor, end: cursor + c, duration: c, color: HEX_CAT2 });
                cursor += c;
            }
            const cat2End = cursor;

            if (r > 0) {
                calculatedPhases.push({ start: cursor, end: cursor + r, duration: r, color: HEX_RSLT });
                cursor += r;
            }
            const resultsEnd = cursor;

            const trackObj = {
                name: item.technique,
                _calculatedPhases: calculatedPhases,
                _totalEnd: cursor,
                _milestones: {
                    cat2: cat2End,       // Completion of Category 2
                    results: resultsEnd  // Completion of Meaningful Results
                }
            };

            trackMap[item.technique] = trackObj;
            processedTracks.push(trackObj);

            if (cursor > maxWeekReached) {
                maxWeekReached = cursor;
            }
        });

        const totalColumnsCount = maxWeekReached;
        const gridContainer = document.getElementById('ganttGrid');

        // Step 2: Render Header
        let headerHtml = `<div class="gantt-row header"><div class="label-column">Technique</div><div class="timeline-column">`;
        for (let i = 0; i <= totalColumnsCount; i++) {
            headerHtml += `<div class="week-cell">Wk ${i}</div>`;
        }
        headerHtml += `</div></div>`;
        gridContainer.innerHTML += headerHtml;

        // Step 3: Render Structural Rows
        let groupRowHtml = `<div class="group-header">SEM SECTION</div>`;
        gridContainer.innerHTML += groupRowHtml;

        processedTracks.forEach(track => {
            let rowHtml = `
                <div class="gantt-row">
                    <div class="label-column" title="${track.name}">${track.name}</div>
                    <div class="timeline-column">
                        <div class="row-guides">`;
            
            for (let i = 0; i <= totalColumnsCount; i++) {
                rowHtml += `<div class="guide-cell"></div>`;
            }
            
            rowHtml += `</div>`;

            track._calculatedPhases.forEach(p => {
                const leftPercent = (p.start / (totalColumnsCount + 1)) * 100;
                const widthPercent = (p.duration / (totalColumnsCount + 1)) * 100;

                rowHtml += `
                    <div class="phase-bar" style="left: ${leftPercent}%; width: ${widthPercent}%; background-color: ${p.color};">
                    </div>
                `;
            });

            rowHtml += `
                    </div>
                </div>
            `;
            gridContainer.innerHTML += rowHtml;
        });
    </script>
</body>
</html>
